<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web Music Player</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="app-container">
        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="nav-section">
                <div class="fake-nav-item active">
                    <svg viewBox="0 0 24 24"><path d="M12.5 3.247a1 1 0 0 0-1 0L4 7.577V20h4.5v-6a1 1 0 0 1 1-1h5a1 1 0 0 1 1 1v6H20V7.577l-7.5-4.33zm-2-1.732a3 3 0 0 1 3 0l7.5 4.33a2 2 0 0 1 1 1.732V21a1 1 0 0 1-1 1h-6.5a1 1 0 0 1-1-1v-6h-3v6a1 1 0 0 1-1 1H3a1 1 0 0 1-1-1V7.577a2 2 0 0 1 1-1.732l7.5-4.33z"/></svg>
                    Home
                </div>
                <div class="fake-nav-item">
                    <svg viewBox="0 0 24 24"><path d="M10.533 1.279c-5.18 0-9.407 4.14-9.407 9.279s4.226 9.279 9.407 9.279c2.234 0 4.29-.77 5.907-2.058l4.353 4.353a1 1 0 1 0 1.414-1.414l-4.344-4.344a9.157 9.157 0 0 0 2.077-5.816c0-5.14-4.226-9.28-9.407-9.28zm-7.407 9.279c0-4.006 3.302-7.28 7.407-7.28s7.407 3.274 7.407 7.28-3.302 7.279-7.407 7.279-7.407-3.273-7.407-7.28z"/></svg>
                    Search
                </div>
            </div>
            <div class="nav-section library">
                <div class="fake-nav-item">
                    <svg viewBox="0 0 24 24"><path d="M3 22a1 1 0 0 1-1-1V3a1 1 0 0 1 2 0v18a1 1 0 0 1-1 1zM15.5 2.134A1 1 0 0 0 14 3v18a1 1 0 0 0 1 1h6a1 1 0 0 0 1-1V6.464a1 1 0 0 0-.5-.866l-6-3.464zM9 2a1 1 0 0 0-1 1v18a1 1 0 1 0 2 0V3a1 1 0 0 0-1-1z"/></svg>
                    Your Library
                </div>
                <!-- Playlist items could go here -->
            </div>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            <div class="playlist-header">
                <div class="playlist-info">
                    <p>AI Music</p>
                    <h1>My Music</h1>
                    <p>Local songs from your device</p>
                </div>
            </div>

            <div class="song-list-container">
                <div class="song-list-header">
                    <div>#</div>
                    <div>Title</div>
                    <div>Album</div>
                    <div><svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor"><path d="M8 1.5a6.5 6.5 0 1 0 0 13 6.5 6.5 0 0 0 0-13zM0 8a8 8 0 1 1 16 0A8 8 0 0 1 0 8z"/><path d="M8 3.25a.75.75 0 0 1 .75.75v3.25H11a.75.75 0 0 1 0 1.5H7.25V4A.75.75 0 0 1 8 3.25z"/></svg></div>
                </div>
                <div id="song-list">
                    <!-- Songs will be injected here by JS -->
                </div>
            </div>
        </main>
    </div>

    <!-- Player Bar -->
    <footer class="player-bar">
        <div class="now-playing-left">
            <div class="now-playing-cover" id="current-cover"></div>
            <div class="now-playing-info">
                <div class="now-playing-title" id="current-title">Not Playing</div>
                <div class="now-playing-artist" id="current-artist"></div>
            </div>
        </div>

        <div class="player-controls-center">
            <div class="controls-buttons">
                <button class="control-btn" id="prev-btn" title="Previous">
                    <svg height="16" width="16" viewBox="0 0 16 16" fill="currentColor"><path d="M13 2.5L5 8l8 5.5V2.5zm-8.5 0v11h-1.5v-11h1.5z"/></svg>
                </button>
                <button class="control-btn play-pause" id="play-pause-btn" title="Play">
                    <svg height="16" width="16" viewBox="0 0 16 16" fill="currentColor" id="play-icon"><path d="M3 2l10 6-10 6V2z"/></svg> 
                </button>
                <button class="control-btn" id="next-btn" title="Next">
                     <svg height="16" width="16" viewBox="0 0 16 16" fill="currentColor"><path d="M3 2.5v11L11 8 3 2.5zm8.5 0v11h1.5v-11h-1.5z"/></svg>
                </button>
            </div>
            <div class="progress-container">
                <span id="current-time">0:00</span>
                <div class="progress-bar-bg" id="progress-container">
                    <div class="progress-bar-fill" id="progress-fill"></div>
                </div>
                <span id="duration">0:00</span>
            </div>
        </div>

        <div class="now-playing-right">
            <!-- Volume placeholder -->
            <svg height="16" width="16" viewBox="0 0 16 16" fill="currentColor"><path d="M9.741.534a.75.75 0 0 1 .845.494 7.502 7.502 0 0 1 0 13.945.75.75 0 0 1-.494-1.418 6.002 6.002 0 0 0 0-11.11.75.75 0 0 1 .143-.911zm2.344 3.42a.75.75 0 1 1 1.056-1.06 9.492 9.492 0 0 1-.001 10.151.75.75 0 1 1-1.055-1.06 7.992 7.992 0 0 0 0-8.03zM1.5 5.5v5h3l5 5V.5l-5 5h-3zm9 7.02L6.568 9.56H3v-3.12h3.568L10.5 3.48v9.04z"/></svg>
        </div>
    </footer>

    <!-- Load Data -->
    <script src="songs.js"></script>
    <!-- App Logic -->
    <script src="script.js"></script>
</body>
</html>
